<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#302f2f">
<link rel="manifest" href="tracker.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nano Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nano Tech – Repair tracker (staff only)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#231f20;--bar:#302f2f;--grey:#f7f7f8;--line:#d4d4d8;--mute:#6b6a6b;--ok:#1f9d6b;--warn:#d98a1a;--err:#d64550;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
.wrap{max-width:1000px;margin:0 auto;padding:22px 20px 80px}
header{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
header img{height:64px;width:auto}
.who{font-size:14px;color:var(--mute)}
.who button{background:none;border:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;padding:6px}
h1{font-size:28px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.btn{font:500 16px Poppins,sans-serif;border:2px solid var(--bar);background:#fff;color:var(--ink);border-radius:999px;padding:12px 24px;min-height:50px;cursor:pointer}
.btn.on,.btn.pri{background:var(--bar);color:#fff}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn:active:not(:disabled){transform:scale(.98)}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{font:500 14px Poppins,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;min-height:42px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--bar);border-color:var(--bar);color:#fff}
input,select,textarea{font:400 17px Poppins,sans-serif;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:50px;width:100%;text-align:center;outline:none}
textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--bar)}
input.bad,textarea.bad{border-color:var(--err)}
label.f{display:block;font-size:13px;font-weight:500;color:var(--mute);margin:0 0 4px}
.search{max-width:420px;margin:0 auto 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.job{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:16px;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.job:active{background:var(--grey)}
.job b{font-size:18px}.job small{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--grey);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.flags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:4px}
.flags span{font-size:12px;background:#ececee;border-radius:6px;padding:2px 8px}
.card{background:#fff;border:1.5px solid var(--bar);border-radius:var(--r);overflow:hidden;margin:0 auto 18px;text-align:center}
.card>h2{margin:0;background:var(--bar);color:#fff;font-size:17px;font-weight:600;padding:12px}
.card .in{padding:18px;background:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.full{grid-column:1/-1}
.chk{display:flex;justify-content:center;align-items:center;gap:12px;min-height:50px;cursor:pointer;font-weight:500}
.chk input{width:28px;height:28px;min-height:0;accent-color:var(--bar)}
.tot{background:var(--grey);border-radius:10px;padding:14px;font-size:18px;font-weight:600}
.tot span{color:var(--ok)}.tot span.neg{color:var(--err)}
.log{list-style:none;padding:0;margin:10px 0 0;font-size:14px;color:var(--mute)}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}.log b{color:var(--ink)}
.login{max-width:440px;margin:30px auto;text-align:center}
.err{color:var(--err);min-height:1.5em;font-size:14px;margin:8px 0}
.note{background:var(--grey);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mute);margin:14px auto;max-width:560px}
.tbl{width:100%;border-collapse:collapse;margin:0 auto}.tbl td,.tbl th{padding:10px;border-bottom:1px solid var(--line);font-size:15px}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;z-index:5}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#off{display:none;position:fixed;top:0;left:0;right:0;background:#d64550;color:#fff;font-size:14px;padding:8px;z-index:20}
header{position:relative}.home-link{position:absolute;left:0;top:6px;font-size:14px;color:var(--ink);text-decoration:none;padding:8px 0}
.tbl td{text-align:left}
</style>
</head>
<body>
<div id="off">No connection to the shop server. Changes can't be saved until it is back.</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = n => '£' + (Number(n) || 0).toFixed(2);
const when = iso => iso ? new Date(iso).toLocaleString('en-GB', {dateStyle:'short', timeStyle:'short'}) : '';
let tok = sessionStorage.getItem('nt_tok'), me = sessionStorage.getItem('nt_me'), role = sessionStorage.getItem('nt_role');
let records = [], recDetail = null, jobs = [], rev = 0, names = null, needsSetup = false, users = [], settings = null, flash = '';
let section = 'repairs', view = 'jobs', filter = 'open', mine = false, q = '', draft = null, orig = null, isNew = false, saving = false, online = true;
const isAdmin = () => role === 'admin';

/* ---------- talking to the shop server ---------- */
function setOnline(v){ if (online !== v) { online = v; $('off').style.display = v ? 'none' : 'block'; } }
async function api(method, url, body){
  let r;
  try { r = await fetch(url, {method, headers:{'Content-Type':'application/json', ...(tok ? {Authorization:'Bearer ' + tok} : {})}, body: body ? JSON.stringify(body) : undefined}); }
  catch(_) { setOnline(false); throw {status:0, error:'No connection to the shop server.'}; }
  setOnline(true);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && tok && !url.includes('/login')) { endSession('Your session ended. Please log in again.'); throw {status:401, error:j.error}; }
  if (!r.ok) throw {status:r.status, ...j};
  return j;
}
function endSession(msg){ tok = me = role = null; sessionStorage.clear(); flash = msg || ''; view = 'jobs'; draft = null; render(); }
async function loadJobs(force){ const r = await api('GET', '/api/jobs?rev=' + (force ? 0 : rev)); if (!r.same) { jobs = r.jobs; records = r.records || []; rev = r.rev; } return !r.same; }
async function poll(){ if (!tok || view !== 'jobs' || document.hidden || document.activeElement?.id === 'search') return; try { if (await loadJobs()) render(); } catch(_) {} }
setInterval(poll, 30000); document.addEventListener('visibilitychange', poll);

/* ---------- job model ---------- */
const STATUS = [['Received','#6b6a6b'],['Diagnosing','#2b7bd6'],['Awaiting customer approval','#d98a1a'],['Waiting for parts','#d98a1a'],['In repair','#2b7bd6'],
  ['Outside repair','#7c5cff'],['Ready for collection','#1f9d6b'],['Collected','#1f9d6b'],['Unrepairable / returned','#d64550']];
const DONE = ['Collected','Unrepairable / returned'];
const dot = s => (STATUS.find(x => x[0] === s) || [0,'#6b6a6b'])[1];
const blank = () => ({ref:'', status:'Received', branch:'', cust:{name:'',phone:'',email:''}, dev:{type:'Phone',brand:'',model:'',storage:'',colour:'',imei:''}, fault:'', quote:'', deposit:'',
  parts:{needed:false, ordered:false, partName:'', supplier:'', cost:'', orderRef:'', orderedOn:'', eta:'', arrived:false},
  repair:{where:'In house', tech:'', outsideCo:'', outsideContact:'', sentOn:'', outsideCost:'', dueBack:'', backOn:''},
  handover:{given:false, on:'', by:'', paid:'', method:'Card'}, notes:[], log:[]});
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const ks = p.split('.'), l = ks.pop(); ks.reduce((a, k) => a[k], o)[l] = v; };

// [path, label, type, options, showWhen]
const SECTIONS = [
  ['Customer & booking', [['branch','Branch','text'],['status','Status','select',STATUS.map(s => s[0])],['cust.name','Customer name','text'],['cust.phone','Phone','tel'],['cust.email','Email','email']]],
  ['Device & fault', [['dev.type','Device type','select',['Phone','Tablet','Laptop','Other']],['dev.brand','Brand','text'],['dev.model','Model','text'],['dev.storage','Storage','text'],['dev.colour','Colour','text'],['dev.imei','IMEI / serial','text'],
    ['fault','Fault / repair requested','area'],['quote','Price quoted (£)','money'],['deposit','Deposit paid (£)','money']]],
  ['Parts', [['parts.needed','Parts needed','check'],['parts.ordered','Parts ordered','check',0,d => d.parts.needed],['parts.partName','Part','text',0,d => d.parts.needed],
    ['parts.supplier','Ordered from (supplier / website)','text',0,d => d.parts.ordered],['parts.cost','Part cost (£)','money',0,d => d.parts.needed],['parts.orderRef','Order ref / tracking','text',0,d => d.parts.ordered],
    ['parts.orderedOn','Ordered on','date',0,d => d.parts.ordered],['parts.eta','Expected arrival','date',0,d => d.parts.ordered],['parts.arrived','Parts arrived','check',0,d => d.parts.ordered]]],
  ['Repair', [['repair.where','Repair done','select',['In house','Outside job']],['repair.tech','Technician','tech',0,d => d.repair.where === 'In house'],
    ['repair.outsideCo','Sent to (shop / person)','text',0,d => d.repair.where === 'Outside job'],['repair.outsideContact','Their contact number','tel',0,d => d.repair.where === 'Outside job'],
    ['repair.sentOn','Sent on','date',0,d => d.repair.where === 'Outside job'],['repair.outsideCost','Outside repair cost (£)','money',0,d => d.repair.where === 'Outside job'],
    ['repair.dueBack','Due back','date',0,d => d.repair.where === 'Outside job'],['repair.backOn','Returned on','date',0,d => d.repair.where === 'Outside job']]],
  ['Payment & handover', [['handover.given','Given back to customer','check'],['handover.on','Given on','date',0,d => d.handover.given],['handover.by','Handed over by','text',0,d => d.handover.given],
    ['handover.paid','Amount taken (£)','money',0,d => d.handover.given],['handover.method','Paid by','select',['Card','Cash','Card + cash','Unpaid'],d => d.handover.given]]]
];
const LABEL = {}; SECTIONS.forEach(([, fs]) => fs.forEach(f => LABEL[f[0]] = f[1]));
const margin = d => (Number(d.quote) || 0) - (Number(d.parts.cost) || 0) - (d.repair.where === 'Outside job' ? Number(d.repair.outsideCost) || 0 : 0);

function field([p, label, type, opts, show], d){
  if (show && !show(d)) return '';
  const v = get(d, p) ?? '';
  let inp;
  if (type === 'check') return `<label class="chk"><input type="checkbox" data-p="${p}" data-rr ${v ? 'checked' : ''}> ${label}</label>`;
  if (type === 'select') inp = `<select data-p="${p}" data-rr>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (type === 'imei') return `<div class="full"><label class="f">${label}</label><div style="display:flex;gap:10px"><input type="text" inputmode="numeric" data-p="imei" value="${esc(v)}" placeholder="15-digit IMEI (dial *#06#)"><button type="button" class="btn pri" data-a="imeichk" style="white-space:nowrap" ${imeiBusy ? 'disabled' : ''}>${imeiBusy ? 'Checking…' : 'Check IMEI'}</button></div>${imeiMsg ? `<div class="err" style="color:var(--mute)">${esc(imeiMsg)}</div>` : ''}${d.imeiResult ? `<div class="note" style="text-align:left;white-space:pre-line;color:var(--ink)">${esc(d.imeiResult)}</div>` : ''}</div>`;
  else if (type === 'multi') return `<div class="full"><label class="f">${label}</label><div class="chips">${opts.map(o => `<button type="button" class="chip" data-a="tf" data-o="${esc(o)}" aria-pressed="${(d.faultsArr || []).includes(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  else if (type === 'photo') return `<div class="full"><label class="f">${label}</label><input type="file" id="idphoto" accept="image/*" capture="environment">${d.photo ? `<img src="${d.photo}" alt="ID" style="max-width:260px;margin-top:10px;border-radius:10px;border:1px solid var(--line)">` : ''}</div>`;
  else if (type === 'tech') inp = `<input list="techs" data-p="${p}" value="${esc(v)}" placeholder="Choose or type"><datalist id="techs">${(names || [me]).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
  else if (type === 'area') inp = `<textarea data-p="${p}">${esc(v)}</textarea>`;
  else if (type === 'money') inp = `<input type="number" step="0.01" min="0" inputmode="decimal" data-p="${p}" data-money value="${esc(v)}">`;
  else inp = `<input type="${type}" data-p="${p}" value="${esc(v)}" ${p === 'branch' ? 'list="branches"' : ''}>`;

function shrinkPhoto(file){
  return new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.75)); };
    img.onerror = () => { URL.revokeObjectURL(u); no(); }; img.src = u; });
}

function diffLog(a, b){
  const out = [], f = v => v === true ? 'Yes' : v === false ? 'No' : (v === '' || v == null ? '—' : v);

  return out;
}

const say = (id, t) => { const e = $(id); if (e) e.textContent = t; };

async function act(a, el){
  const n = el.dataset.n;
  try { switch (a) {
    case 'logout': api('POST', '/api/logout').catch(() => {}); return endSession();
    case 'pick': sessionStorage.setItem('nt_pick', n); document.querySelectorAll('[data-a=pick]').forEach(x => x.setAttribute('aria-pressed', x === el)); return $('lpw').focus();
    case 'setup': {
      const name = $('lname').value.trim(), p = $('lpw').value;
      if (p !== $('lpw2').value) return say('lerr', 'Passwords do not match.');
      await api('POST', '/api/setup', {code:$('lcode').value, name, password:p}); needsSetup = false; return await login(name, p);
    }
    case 'login': return await login(names ? sessionStorage.getItem('nt_pick') : $('lname').value.trim(), $('lpw').value);
    case 'sec': section = el.dataset.v; view = 'jobs'; if (section === 'settings') await loadAdmin(); return render();
    case 'newrec': recType = el.dataset.t; imeiBusy = false; imeiMsg = ''; draft = recBlank(recType); orig = JSON.parse(JSON.stringify(draft)); view = 'newrec'; return render();
    case 'tf': { const a = draft.faultsArr, o = el.dataset.o, i = a.indexOf(o); i < 0 ? a.push(o) : a.splice(i, 1); el.setAttribute('aria-pressed', i < 0); return; }
    case 'openrec': recDetail = records.find(r => r.id === el.dataset.id); draft = orig = null; view = 'rec'; return render();
    case 'saverec': return await saveRec();
    case 'imeichk': return await checkImei();
    case 'imeikeysave': { try { await api('PUT', '/api/settings', {imeiKey:$('imeikey').value}); await loadAdmin(); render(); say('ierr', 'Key saved.'); } catch (e) { say('ierr', e.error || 'Could not save.'); } return; }
    case 'imeitest': { say('ierr', 'Testing…'); try { const r = await api('POST', '/api/imei/test'); say('ierr', `Connected as ${r.username}. Balance: ${r.credit} ${r.currency}`); } catch (e) { say('ierr', e.error || 'Could not connect.'); } return; }
    case 'imeiservices': { say('ierr', 'Loading…'); try { imeiServices = (await api('GET', '/api/imei/services')).services; render(); say('ierr', `${imeiServices.length} services loaded. Pick one and save.`); } catch (e) { say('ierr', e.error || 'Could not load the list.'); } return; }
    case 'imeisvcsave': { try { const o = $('imeisvc').selectedOptions[0]; await api('PUT', '/api/settings', {imeiService:{id:o.value, name:o.text.split(' – ')[0]}}); await loadAdmin(); render(); say('ierr', 'Service saved.'); } catch (e) { say('ierr', e.error || 'Could not save.'); } return; }
    case 'recreceipt': { try { await api('POST', `/api/records/${recDetail.id}/receipt`, {to:$('rcptto').value}); await new Promise(x => setTimeout(x, 1500)); await loadJobs(true); recDetail = records.find(x => x.id === recDetail.id) || recDetail; render(); const l = (recDetail.receipts || []).at(-1); if (l && l.status === 'failed') say('rerr', l.error || 'The email could not be sent.'); } catch (e) { say('rerr', e.error || 'Could not send.'); } return; }
    case 'recdel': if (confirm(`Delete ${recDetail.ref}? A copy is kept on the server.`)) { await api('DELETE', '/api/records/' + recDetail.id); records = records.filter(r => r.id !== recDetail.id); view = 'jobs'; render(); } return;
    case 'jobreceipt': { try { await api('POST', `/api/jobs/${draft.id}/receipt`, {to:draft.cust.email}); await new Promise(x => setTimeout(x, 1500)); await loadJobs(true); const j = jobs.find(x => x.id === draft.id); draft.receipts = j.receipts; editView(); const l = (j.receipts || []).at(-1); say('rerr', l && l.status === 'failed' ? (l.error || 'The email could not be sent.') : 'Receipt queued. The status above updates when it is sent.'); } catch (e) { say('rerr', e.error || 'Could not send.'); } return; }
    case 'shopsave': await api('PUT', '/api/settings', {shop:{name:$('shname').value, phone:$('shphone').value, address:$('shaddr').value, email:$('shemail').value, vat:$('shvat').value, footer:$('shfoot').value}}); await loadAdmin(); render(); return say('sherr', 'Saved.');
    case 'mailtest': say('merr', 'Sending…'); await api('POST', '/api/mail/test', {to:$('mailto').value}); return say('merr', 'Sent. Check that inbox.');
    case 'csvrec': { const ty = el.dataset.t, rows = records.filter(r => r.type === ty), cols = ty === 'buy' ? ['Ref','Date','Device','Capacity','Condition','IMEI','Paid','Seller','Seller contact','Seller email','Logged by'] : ['Ref','Date','Device','Grade','IMEI','Price','Buyer','Buyer contact','Buyer email','Sold by'];
      const data = rows.map(r => ty === 'buy' ? [r.ref, r.date, [r.brand, r.model].join(' '), r.capacity, r.condition, r.imei, r.price, r.sellerName, r.sellerContact, r.sellerEmail, r.createdBy] : [r.ref, r.date, [r.brand, r.model].join(' '), r.grade, r.imei, r.price, r.buyerName, r.buyerContact, r.buyerEmail, r.createdBy]);
      return dl(ty === 'buy' ? 'nano-purchases.csv' : 'nano-sales.csv', 'text/csv', [cols, ...data].map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')); }
    case 'filter': filter = el.dataset.k; return render();
    case 'mine': mine = !mine; return render();
    case 'new': draft = blank(); orig = JSON.parse(JSON.stringify(draft)); isNew = true; view = 'edit'; return render();
    case 'open': draft = JSON.parse(JSON.stringify(jobs.find(j => j.id === el.dataset.id))); orig = JSON.parse(JSON.stringify(draft)); isNew = false; view = 'edit'; return render();
    case 'cancel': if (JSON.stringify(draft) !== JSON.stringify(orig) && !confirm('Discard your changes?')) return; view = 'jobs'; await loadJobs().catch(() => {}); return render();
    case 'addnote': { const t = $('newnote').value.trim(); if (!t) return; draft.notes.push({at:new Date().toISOString(), by:me, text:t}); return editView(); }
    case 'save': return await saveJob();
    case 'del': if (confirm(`Delete ${draft.ref}? This cannot be undone.`)) { await api('DELETE', '/api/jobs/' + draft.id); jobs = jobs.filter(j => j.id !== draft.id); view = 'jobs'; render(); } return;
    case 'mypw': { const p = $('mypw').value; await api('POST', '/api/me/password', {password:p}); $('mypw').value = ''; return say('perr', 'Password updated.'); }
    case 'adduser': { await api('POST', '/api/users', {name:$('nname').value, password:$('npw').value, role:$('nrole').value}); await loadAdmin(); return render(); }
    case 'reset': { const p = prompt(`New password for ${n} (min 8 characters):`); if (!p) return; await api('POST', `/api/users/${encodeURIComponent(n)}/password`, {password:p}); return alert('Password reset. They will be logged out.'); }
    case 'rmuser': if (confirm(`Remove ${n}? Their past jobs stay in the tracker.`)) { await api('DELETE', '/api/users/' + encodeURIComponent(n)); await loadAdmin(); render(); } return;
    case 'slacksave': {
      const u = $('swh').value.trim();
      await api('PUT', '/api/settings', {auto:$('sauto').checked, onExport:$('sexp').checked, details:$('sdet').checked, daily:$('sdaily').value, ...(u ? {slackUrl:u} : {})});
      await loadAdmin(); render(); return say('serr', 'Saved.');
    }
    case 'slackoff': if (confirm('Disconnect Slack? Queued messages are dropped.')) { await api('PUT', '/api/settings', {slackUrl:''}); await loadAdmin(); render(); } return;
    case 'slacktest': say('serr', 'Sending…'); await api('POST', '/api/slack/test'); return say('serr', 'Slack accepted it. Check your channel.');
    case 'slacksum': await api('POST', '/api/slack/summary', {reason:'summary'}); return say('serr', 'Summary sent.');
    case 'csv': {
      const cols = ['Ref','Booked','Booked by','Branch','Status','Customer','Phone','Device','Fault','Quoted','Parts needed','Parts ordered','Ordered from','Part cost','Repair','Technician','Outside company','Outside cost','Given back','Given on','Given by','Amount taken'];
      const rows = jobs.map(j => [j.ref, j.createdAt, j.createdBy, j.branch, j.status, j.cust.name, j.cust.phone, [j.dev.brand, j.dev.model].join(' '), j.fault, j.quote, j.parts.needed ? 'Yes' : 'No', j.parts.ordered ? 'Yes' : 'No',
        j.parts.supplier, j.parts.cost, j.repair.where, j.repair.tech, j.repair.outsideCo, j.repair.outsideCost, j.handover.given ? 'Yes' : 'No', j.handover.on, j.handover.by, j.handover.paid]);
      dl('nano-repairs.csv', 'text/csv', [cols, ...rows].map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n'));
      api('POST', '/api/slack/summary', {reason:'export'}).catch(() => {}); return;
    }
    case 'backup': { const b = await api('GET', '/api/backup'); dl(`nano-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`, 'application/json', JSON.stringify(b)); return api('POST', '/api/slack/summary', {reason:'export'}).catch(() => {}); }
  } } catch (e) { const t = e.error || 'Something went wrong.'; const box = document.querySelector('#lerr,#eerr,#serr,#uerr,#perr'); if (box) box.textContent = t; else alert(t); }
}
function applyHash(){   // #buy / #sell from the start page: open that form straight away
  const h = location.hash; if (!tok || (h !== '#buy' && h !== '#sell')) return;
  history.replaceState(null, '', location.pathname); imeiBusy = false; imeiMsg = ''; recType = h === '#buy' ? 'buy' : 'sell'; section = h === '#buy' ? 'buying' : 'selling';
  draft = recBlank(recType); orig = JSON.parse(JSON.stringify(draft)); view = 'newrec';
}
async function login(name, pw){
  if (!name) return say('lerr', 'Tap your name first.');
  const r = await api('POST', '/api/login', {name, password:pw});
  tok = r.token; me = r.name; role = r.role; sessionStorage.setItem('nt_tok', tok); sessionStorage.setItem('nt_me', me); sessionStorage.setItem('nt_role', role); sessionStorage.removeItem('nt_pick');
  try { names = (await api('GET', '/api/public')).names; } catch(_) {}
  await loadJobs(true); view = 'jobs'; applyHash(); render(); bump();
}
const refreshRec = () => { if (view === 'newrec') { const y = scrollY; recFormView(); scrollTo(0, y); } };
function guessImei(t){
  const s = t.toLowerCase();
  if (/(black\s?list(ed)?|barred|stolen|lost|blocked|reported)[^\n]{0,40}(yes|true|listed|barred|stolen|lost|blocked|reported)/.test(s) && !/(not|no)[ -]?(black\s?listed|barred|stolen|lost|blocked)/.test(s)) return 'Blacklisted';
  if (/(clean|clear|not\s*black\s?listed|not\s*reported|black\s?list[^\n]{0,20}\b(no|false)\b)/.test(s)) return 'Clear';
  return 'Pending';
}
async function checkImei(){
  const imei = String(draft.imei || '').replace(/\D/g, '');
  if (imei.length !== 15) { imeiMsg = 'Enter the full 15-digit IMEI first (dial *#06# on the phone to see it).'; return refreshRec(); }
  imeiBusy = true; imeiMsg = 'Checking… this can take up to a minute.'; draft.imeiResult = ''; refreshRec();
  try {
    let r = await api('POST', '/api/imei/check', {imei});
    for (let i = 0; r.pending && i < 30 && view === 'newrec'; i++) { await new Promise(x => setTimeout(x, 4000)); const ref = r.ref; r = {...await api('GET', `/api/imei/result?ref=${encodeURIComponent(ref)}&imei=${imei}`), ref}; }
    if (r.done) {
      draft.imei = imei; draft.imeiResult = r.text; imeiMsg = r.cached ? `Saved result from ${when(r.at)} (no new charge).` : 'Check complete.';
      if (recType === 'buy') { draft.imeiCheck = guessImei(r.text); imeiMsg += ` Suggested IMEI check result: ${draft.imeiCheck}. Please read the details and change it if needed.`; }
    } else imeiMsg = 'Still waiting for the service. Tap Check IMEI again in a minute.';
  } catch (e) { imeiMsg = e.error || 'The check failed.'; }
  imeiBusy = false; refreshRec();
}
async function saveRec(){
  if (saving) return; const d = draft, t = recType, miss = REQ[t].filter(k => !String(d[k]).trim() || d[k] === 'Select brand');
  if (miss.length) { miss.forEach(k => document.querySelector(`[data-p="${k}"]`)?.classList.add('bad')); return say('eerr', 'Please fill in the highlighted fields.'); }
  const rec = {...d}; delete rec.faultsArr; delete rec.faultsText;
  if (t === 'buy') rec.faults = [...d.faultsArr.filter(x => x !== 'None' || d.faultsArr.length === 1), d.faultsText.trim()].filter(Boolean).join(', ') || 'None';
  saving = true; $('savebtn').disabled = true; say('eerr', '');
  try { const r = await api('POST', '/api/records', {type:t, record:rec}); records = [...records, r.record]; recDetail = r.record; draft = orig = null; view = 'rec'; render(); }
  catch (e) { say('eerr', e.error || 'Could not save.'); }
  finally { saving = false; if ($('savebtn')) $('savebtn').disabled = false; }
}
async function saveJob(){
  if (saving) return;
  if (!draft.cust.name.trim() || !(draft.dev.model.trim() || draft.dev.brand.trim()) || !draft.fault.trim()) {
    ['cust.name','dev.model','fault'].forEach(p => { const e = document.querySelector(`[data-p="${p}"]`); if (e && !get(draft, p).trim() && !(p === 'dev.model' && draft.dev.brand.trim())) e.classList.add('bad'); });
    return say('eerr', 'Customer name, device and fault are required.');
  }
  saving = true; $('savebtn').disabled = true; say('eerr', '');
  try {
    const r = isNew ? await api('POST', '/api/jobs', {job:draft}) : await api('PUT', '/api/jobs/' + draft.id, {job:draft, base:orig.updatedAt, changes:diffLog(orig, draft)});
    jobs = isNew ? [...jobs, r.job] : jobs.map(j => j.id === r.job.id ? r.job : j); view = 'jobs'; await loadJobs().catch(() => {}); render();
  } catch (e) {
    if (e.status === 409) {
      if (confirm(`${e.job.ref} was just changed by ${e.job.updatedBy} (${when(e.job.updatedAt)}).\n\nLoad their version? Your unsaved changes will be lost. Press Cancel to keep editing.`)) { draft = JSON.parse(JSON.stringify(e.job)); orig = JSON.parse(JSON.stringify(e.job)); editView(); }
    } else say('eerr', e.error || 'Could not save.');
  } finally { saving = false; if ($('savebtn')) $('savebtn').disabled = false; }
}

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el) act(el.dataset.a, el); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search' || t.id === 'recsearch') { if (t.id === 'search') q = t.value; else recSearch = t.value; const p = t.selectionStart, id = t.id; render(); const s = $(id); s.focus(); s.setSelectionRange(p, p); return; }
  if (t.dataset.p && draft) { set(draft, t.dataset.p, t.type === 'checkbox' ? t.checked : t.value); t.classList.remove('bad'); if (t.dataset.money !== undefined && view === 'edit') showMargin(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.rr !== undefined && draft) { set(draft, t.dataset.p, t.type === 'checkbox' ? t.checked : t.value); const y = scrollY; view === 'newrec' ? recFormView() : editView(); scrollTo(0, y); }
  if (t.id === 'idphoto' && t.files[0] && draft) { try { draft.photo = await shrinkPhoto(t.files[0]); const y = scrollY; recFormView(); scrollTo(0, y); } catch(_) { alert('That photo could not be read.'); } return; }
  if (t.id === 'importf' && t.files[0]) {
    try { const b = JSON.parse(await t.files[0].text()); if (!Array.isArray(b.jobs)) throw 0; const r = await api('POST', '/api/import', {jobs:b.jobs}); await loadJobs(true); alert(`${r.added} job${r.added === 1 ? '' : 's'} imported.`); }
    catch(_) { alert('That file could not be imported.'); }
    t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lpw' || e.target.id === 'lpw2')) document.querySelector('[data-a=login],[data-a=setup]')?.click(); });

/* log out after 5 minutes without touching the screen */
let idle; const bump = () => { clearTimeout(idle); if (tok) idle = setTimeout(() => { api('POST', '/api/logout').catch(() => {}); endSession('Logged out after 5 minutes of inactivity.'); }, 300000); };
['pointerdown', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, bump, {passive:true}));
addEventListener('online', poll); addEventListener('contextmenu', e => e.preventDefault());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => { try { const p = await api('GET', '/api/public'); names = p.names; needsSetup = p.needsSetup; } catch(_) {} if (tok) { try { await loadJobs(true); } catch(_) {} applyHash(); } render(); bump(); })();
</script>
</body>
</html>
